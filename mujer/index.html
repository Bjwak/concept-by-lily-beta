<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3dde2">
  <meta name="description" content="Accesorios para mujer de Concept by Lily. Consulta productos, variantes y disponibilidad.">
  <link rel="icon" type="image/png" href="../favicon.png">
  <link rel="stylesheet" href="../css/catalogo.css">
  <title>Accesorios para mujer | Concept by Lily</title>
  <style>
    :root{--accent:#c98796;--accent-dark:#a96576;--accent-soft:#f3dde2;--page:#fff7f8;}
  </style>
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
  <script>window.CATALOG_CONFIG={storeId:"937fc539-9b4f-4f8f-a0d6-676408a5359a"};</script>
  <script type="module" src="../js/catalogo.js"></script>
</head>
<body>
  <header class="site-header">
    <a href="../" class="back-home"><span aria-hidden="true">←</span> Volver al inicio</a>
    <img src="banner-accesorios.png" alt="Concept by Lily | Accesorios para mujer">
  </header>

  <main>
    <section class="catalog-tools">
      <div class="search-wrap">
        <input id="productSearch" type="search" placeholder="Buscar productos..." aria-label="Buscar productos">
      </div>
      <nav id="categoryNav" class="category-nav" aria-label="Filtrar por categoría">
        <button class="category-btn active" type="button">Todos</button>
      </nav>
      <p id="productCount" class="product-count" aria-live="polite"></p>
      <p id="catalogMessage" class="catalog-message" role="status"></p>
    </section>

    <section id="productsContainer" class="products" aria-live="polite">
      <div class="empty-state"><h2>Cargando colección…</h2></div>
    </section>

    <section class="cart" aria-labelledby="cartTitle">
      <h2 id="cartTitle">🛒 Tu carrito</h2>
      <div id="cartItems"><p class="empty-cart">Tu carrito está vacío.</p></div>
      <div id="total" class="total">Total: C$ 0.00</div>
      <button id="whatsappBtn" class="whatsapp-btn" type="button">Preparar pedido</button>
    </section>
  </main>

  <div id="invoiceModal" class="invoice-modal" role="dialog" aria-modal="true" aria-label="Proforma de pedido">
    <div class="invoice-dialog">
      <div id="invoiceArea"></div>
      <button id="shareInvoice" class="share-button" type="button">💖 Compartir pedido</button>
      <button id="closeInvoice" class="close-button" type="button">Cerrar</button>
    </div>
  </div>

  <footer class="site-footer">© <span id="currentYear"></span> Concept by Lily</footer>
</body>
</html>
